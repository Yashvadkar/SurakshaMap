<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Console — SurakshaMap</title>

  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layouts.css">
  <link rel="icon" type="image/png" href="assets/SurakshaMap_logo.png">
</head>
<body class="admin-page">

  <!-- ─── Header ─── -->
  <header class="site-header admin-header">
    <div class="header-inner admin-header-inner">
      <a href="index.html" class="brand admin-brand">
        <img src="assets/SurakshaMap_logo.png" alt="SurakshaMap" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">SurakshaMap</span>
        <span class="badge badge-ai">Admin</span>
      </a>
      <div class="header-actions admin-header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button id="btn-admin-logout" class="btn btn-ghost btn-sm admin-btn-logout" style="display:none;">Sign Out</button>
        <a href="index.html" class="btn btn-ghost btn-sm admin-btn-back"><span class="btn-text-full">← Back to App</span><span class="btn-text-mobile">← App</span></a>
      </div>
    </div>
  </header>

  <main>
    <!-- ─── Auth Section ─── -->
    <div id="admin-auth-section">
      <div class="container container-sm admin-auth-container" style="padding-top:var(--space-3xl);padding-bottom:var(--space-3xl);">
        <div style="text-align:center;margin-bottom:var(--space-2xl);">
          <div style="width:64px;height:64px;border-radius:var(--radius-lg);background:var(--c-primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:var(--space-md);">🔐</div>
          <h1 class="text-heading">Admin Console</h1>
          <p class="text-muted text-small">Sign in with your admin credentials to manage reports.</p>
        </div>

        <div class="card admin-login-card">
          <form id="admin-login-form">
            <div class="form-group">
              <label class="form-label" for="admin-email">Email</label>
              <input type="email" id="admin-email" class="form-input" placeholder="admin@surakshamap.in" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="admin-password">Password</label>
              <input type="password" id="admin-password" class="form-input" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">🔐 Sign In</button>
          </form>

          <div style="margin-top:var(--space-lg);padding-top:var(--space-md);border-top:1px solid var(--c-border);">
            <p class="text-caption text-muted" style="text-align:center;">Demo credentials: admin@surakshamap.in / suraksha-demo</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── Dashboard Section ─── -->
    <div id="admin-dashboard" style="display:none;">
      <div class="admin-layout">

        <!-- Stats Bar -->
        <div class="admin-stats">
          <div class="stat-card">
            <div class="stat-value primary" id="admin-stat-total">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-card">
            <div class="stat-value warning" id="admin-stat-pending">0</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-card">
            <div class="stat-value success" id="admin-stat-resolved">0</div>
            <div class="stat-label">Resolved</div>
          </div>
          <div class="stat-card">
            <div class="stat-value danger" id="admin-stat-rejected">0</div>
            <div class="stat-label">Rejected</div>
          </div>
        </div>

        <!-- Action Bar -->
        <div class="card admin-action-bar-card" style="margin-bottom:var(--space-lg);">
          <div class="admin-action-bar-inner">
            <div class="admin-action-btn-group">
              <button class="btn btn-primary btn-sm admin-action-btn" onclick="runBatchAIReview()">🤖 Run Batch AI Review</button>
              <button class="btn btn-secondary btn-sm admin-action-btn" id="export-csv">📥 Export CSV</button>
              <button class="btn btn-secondary btn-sm admin-action-btn" id="export-json">📥 Export JSON</button>
            </div>
            <div class="admin-search-wrapper">
              <input type="text" id="admin-search" class="form-input" placeholder="Search by token, category, description..." style="font-size:0.85rem;">
            </div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="pending">
            🤖 AI Queue <span class="tab-count" id="tab-count-pending"></span>
          </button>
          <button class="admin-tab" data-tab="review">
            ⏳ Review <span class="tab-count" id="tab-count-review"></span>
          </button>
          <button class="admin-tab" data-tab="duplicates">
            📋 Duplicates <span class="tab-count" id="tab-count-duplicates"></span>
          </button>
          <button class="admin-tab" data-tab="active">
            🔧 Active <span class="tab-count" id="tab-count-active"></span>
          </button>
          <button class="admin-tab" data-tab="resolved">✅ Resolved</button>
          <button class="admin-tab" data-tab="rejected">❌ Rejected</button>
          <button class="admin-tab" data-tab="all">📊 All</button>
        </div>

        <!-- Reports Table -->
        <div class="card admin-table-card" style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Token</th>
                <th>Category</th>
                <th>Severity</th>
                <th>Details</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-table-body">
              <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--c-text-muted);">Loading reports...</td></tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <!-- Environment Variables (Excluded from git via .gitignore) -->
  <script src="env.js" onerror="/* env.js not present, using default configuration */"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/risk-engine.js"></script>
  <script src="js/ai-review.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
